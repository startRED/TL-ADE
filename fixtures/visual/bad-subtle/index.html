<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TL-ADE — Fixture Generica Sem Falha Mecanica</title>
  <style>
    body {
      font-family: 'Manrope', sans-serif;
      background-color: #ffffff;
      color: #111827;
      margin: 0;
      padding: 24px;
      line-height: 1.5;
    }
    .wrapper {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      color: #111827;
      margin-bottom: 12px;
    }
    p {
      color: #374151;
      font-size: 16px;
      margin-bottom: 16px;
    }
    .generic-card {
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      padding: 16px;
      margin-top: 16px;
      background: #f9fafb;
    }
    button {
      background-color: #1d4ed8;
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <h1>Superfície Genérica Padrão</h1>
    <p>Esta página não possui erros de console, nem quebra de contraste ou responsividade, mas carece de identidade, assinatura e especificidade de design.</p>
    <div class="generic-card">
      <p>Card padrão sem ritmo vertical ou hierarquia autorada.</p>
      <button type="button">Clique Aqui</button>
    </div>
  </div>
</body>
</html>
