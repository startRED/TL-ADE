<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>exemplo-login</title>
  <style>
    body { margin: 0; font: 15px/1.5 system-ui, "Segoe UI", sans-serif; background: #f5f6f8; color: #1d232b; }
    main { max-width: 720px; margin: 0 auto; padding: 32px 20px 60px; display: grid; gap: 28px; }
    h1 { font-size: 20px; margin: 0; }
    section { background: #fff; border: 1px solid #dfe3e8; border-radius: 10px; padding: 20px; }
    section h2 { font-size: 15px; margin: 0 0 12px; color: #4b5563; text-transform: uppercase; letter-spacing: .05em; }
    form { display: grid; gap: 10px; }
    label { display: grid; gap: 4px; font-size: 13px; color: #374151; }
    input, select { padding: 8px 10px; border: 1px solid #c9cfd6; border-radius: 6px; font: inherit; }
    button { padding: 9px 14px; border: 0; border-radius: 6px; background: #137f88; color: #fff; font: inherit; font-weight: 600; cursor: pointer; justify-self: start; }
    button[disabled] { opacity: .5; cursor: default; }
    .error { color: #b7332a; margin: 0; }
    table { border-collapse: collapse; width: 100%; }
    td, th { text-align: left; padding: 6px 8px; border-bottom: 1px solid #e5e7eb; }
    .empty { color: #6b7280; }
  </style>
</head>
<body>
  <main id="app"><h1>exemplo-login</h1></main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
